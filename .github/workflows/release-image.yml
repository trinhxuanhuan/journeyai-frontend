name: Publish release image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release configuration
        id: release
        shell: bash
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
          SITE_URL: ${{ vars.STAGING_SITE_URL }}
        run: |
          set -euo pipefail
          for value in "$API_URL" "$SITE_URL"; do
            if [[ ! "$value" =~ ^https://[^/]+/?$ ]]; then
              echo "STAGING_API_URL and STAGING_SITE_URL must be absolute HTTPS origins in repository variables." >&2
              exit 1
            fi
          done
          sha_tag="sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$sha_tag"
          else
            release_tag="$GITHUB_REF_NAME"
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Release tag must follow vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER." >&2
              exit 1
            fi
          fi
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish traceable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_SITE_URL }}
          tags: |
            ghcr.io/${{ steps.release.outputs.owner }}/journeyai-frontend:${{ steps.release.outputs.tag }}
            ghcr.io/${{ steps.release.outputs.owner }}/journeyai-frontend:${{ steps.release.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.title=Việt Khám Phá frontend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          sbom: true
